name: Release

# Publica o Relay (Mac: .dmg aarch64 + x86_64; Windows: instalador NSIS do agente) num único
# GitHub Release + latest.json do updater. Dispara só em tag vX.Y.Z. Ver docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Notas = seção da versão no CHANGELOG.md (sem seção, cai nas notas geradas do GitHub). O corpo
      # do release vira o campo `notes` do latest.json, que o modal de atualização mostra.
      - name: cria o release (publicado, notas do CHANGELOG)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes_arg=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md sem seção para $TAG: usando notas geradas"
            notes_arg=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag --title "Relay $TAG" "${notes_arg[@]}" --draft=false
          id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          body=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .body)
          { echo "notes<<RELAY_NOTES_EOF"; echo "$body"; echo "RELAY_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

  # Os jobs de build rodam em sequência (max-parallel 1 + needs): cada um regrava o latest.json
  # com a sua plataforma, e em paralelo um sobrescreveria o outro.
  mac:
    needs: create-release
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-mac-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # Secret vazio no env faz o tauri tentar importar um certificado inexistente e falhar;
      # por isso há dois steps: com Developer ID (se APPLE_CERTIFICATE existir) e ad-hoc ("-").
      - name: build assinado (Developer ID)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/mac
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: false
          includeUpdaterJson: true
      - name: build sem Developer ID (assinatura ad-hoc)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/mac
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: false
          includeUpdaterJson: true

  windows:
    needs: [create-release, mac]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows
      - run: pnpm install --frozen-lockfile
      - name: sidecar relay-service (release real)
        run: bash scripts/prepare-sidecar.sh
      # Assinatura do instalador só se WINDOWS_CERTIFICATE (.pfx em base64) existir.
      - name: assinatura Windows (opcional)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            pw=$(printf %s "$WINDOWS_CERTIFICATE_PASSWORD" | sed "s/'/''/g")
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String '$pw' -AsPlainText -Force; (Import-PfxCertificate -FilePath \"\$env:RUNNER_TEMP\\cert.pfx\" -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint" | tr -d '\r')
            printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' "$thumb" > apps/windows-agent/src-tauri/tauri.signing.conf.json
            echo "TAURI_ARGS=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_ENV"
          else
            echo "Sem WINDOWS_CERTIFICATE: instalador sem assinatura."
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Chave do updater (obrigatória: createUpdaterArtifacts=true); só neste step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows-agent
          tauriScript: pnpm tauri
          args: ${{ env.TAURI_ARGS }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: false
          includeUpdaterJson: true
