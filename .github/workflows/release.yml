name: Release

# Publica o Relay (Mac: .dmg aarch64 + x86_64; Windows: instalador NSIS do agente) num único
# GitHub Release + latest.json do updater. Dispara só em tag vX.Y.Z. Ver docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Notas = seção da versão no CHANGELOG.md (sem seção, cai nas notas geradas do GitHub). O corpo
      # do release vira o campo `notes` do latest.json, que o modal de atualização mostra.
      # Nasce como rascunho e só é publicado no job `publish`, depois de todos os builds: publicado
      # antes, o latest.json ficava minutos só com o Mac e o updater do Windows falhava nesse intervalo.
      - name: cria o release (rascunho, notas do CHANGELOG)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes_arg=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md sem seção para $TAG: usando notas geradas"
            notes_arg=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag --title "Relay $TAG" "${notes_arg[@]}" --draft
          # releases/tags/<tag> não enxerga rascunhos: procura na lista.
          rel=$(gh api "repos/${{ github.repository }}/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0]")
          id=$(jq -r .id <<< "$rel")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          body=$(jq -r .body <<< "$rel")
          { echo "notes<<RELAY_NOTES_EOF"; echo "$body"; echo "RELAY_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

  # Os jobs de build rodam em sequência (max-parallel 1 + needs): cada um regrava o latest.json
  # com a sua plataforma, e em paralelo um sobrescreveria o outro.
  mac:
    needs: create-release
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-mac-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # Secret vazio no env faz o tauri tentar importar certificado ou notarizar e falhar; por isso
      # um step por caso: Developer ID + notarização (APPLE_ID), certificado próprio sem notarização
      # (hoje: "Relay Self-Signed", que mantém as permissões do macOS entre versões) e ad-hoc ("-").
      - name: build assinado e notarizado (Developer ID)
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_ID == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/mac
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
      # O tauri, ao importar APPLE_CERTIFICATE, só aceita nomes da Apple ("Developer ID Application:"…).
      # O certificado próprio vai para um keychain do job, na lista de busca, e o tauri recebe só o nome.
      - name: importar certificado próprio
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_ID != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/relay-sign.keychain-db"
          kpw=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/relay.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/relay.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/relay.p12"
      - name: build assinado com certificado próprio (sem notarização)
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_ID != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/mac
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
      - name: build sem certificado (assinatura ad-hoc)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/mac
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true

  windows:
    needs: [create-release, mac]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows
      - run: pnpm install --frozen-lockfile
      - name: sidecar relay-service (release real)
        run: bash scripts/prepare-sidecar.sh
      # Assinatura do instalador só se WINDOWS_CERTIFICATE (.pfx em base64) existir.
      - name: assinatura Windows (opcional)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            pw=$(printf %s "$WINDOWS_CERTIFICATE_PASSWORD" | sed "s/'/''/g")
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String '$pw' -AsPlainText -Force; (Import-PfxCertificate -FilePath \"\$env:RUNNER_TEMP\\cert.pfx\" -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint" | tr -d '\r')
            printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' "$thumb" > apps/windows-agent/src-tauri/tauri.signing.conf.json
            echo "TAURI_ARGS=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_ENV"
          else
            echo "Sem WINDOWS_CERTIFICATE: instalador sem assinatura."
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Chave do updater (obrigatória: createUpdaterArtifacts=true); só neste step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows-agent
          tauriScript: pnpm tauri
          args: ${{ env.TAURI_ARGS }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true

  # Mac e PC têm de sair juntos: o app mais antigo se atualiza ao ver o outro numa versão nova, e isso
  # só funciona se o latest.json do rascunho já tem as três plataformas na versão da tag.
  # releases/tags/<tag> e o download público não enxergam rascunho: API autenticada, pelo id.
  verify-latest:
    needs: [create-release, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: latest.json do rascunho tem as três plataformas na versão da tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          asset=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::o rascunho não tem latest.json"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          bash scripts/check-latest-json.sh "$TAG" "$RUNNER_TEMP/latest.json"

  publish:
    needs: [create-release, mac, windows, verify-latest]
    runs-on: ubuntu-latest
    steps:
      - name: publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
