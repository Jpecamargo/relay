[package]
name = "relay-windows-agent"
description = "App Tauri v2 (windows-agent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_agent_lib"
path = "src/lib.rs"

[[bin]]
name = "relay-windows-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
relay-core.workspace = true
tauri = { workspace = true, features = ["image-ico"] }
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
relay-platform-windows.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tempfile.workspace = true
rtrb.workspace = true
