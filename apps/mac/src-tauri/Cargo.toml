[package]
name = "relay-mac"
description = "App Tauri v2 (mac)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relay_mac_lib"
path = "src/lib.rs"

[[bin]]
name = "relay-mac"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
relay-core.workspace = true
tauri = { workspace = true, features = ["macos-private-api"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
relay-platform-macos.workspace = true
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde_json = "1"
rtrb.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
relay-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
